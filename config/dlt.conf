# shellcheck shell=bash
# shellcheck disable=SC2034

# Research-Based Configuration
WARMUP_ITERATIONS=50
RAMPUP_ITERATIONS=100
SUSTAINED_ITERATIONS=850
TOTAL_ITERATIONS=1000

# Apache Bench Parameters
AB_REQUESTS=1000
AB_CONCURRENCY=50
THINK_TIME_MS=2000
TEST_TIMEOUT=30

# Test scenarios
declare -A SCENARIOS=(
    ["DYNAMIC"]="http://myblog.local/post/3/visiting-bali-a-journey-of-serenity-and-culture"
    ["STATIC"]="http://myblog.local/login"
    ["404_ERROR"]="http://myblog.local/this-is-not-real-page"
)

# Statistics
CONF_Z=1.96

# Memory Monitoring Configuration
MEMORY_MONITORING=true
MEMORY_SAMPLE_INTERVAL=5  # seconds (matches current system metrics)
MEMORY_INCLUDE_PROCESS=true
MEMORY_INCLUDE_SWAP=true
MEMORY_THRESHOLD_WARNING=80  # % memory usage warning threshold

# Tooling
AB_BIN=ab
REPORT_ROOT=./load_test_reports
